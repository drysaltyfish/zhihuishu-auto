# electron-builder 打包配置（Windows / 免安装 Portable）
# 只出两种免安装产物，不再产出 NSIS 安装包：
#   - portable：单文件 exe，双击后自解压到自己的 %TEMP% 目录再运行，退出即清理
#               data/ 靠 PORTABLE_EXECUTABLE_DIR 写回 exe 所在目录（见 desktop/paths-plan.mjs）
#   - zip     ：解压即用的目录包（推荐，启动最快），data/ 就在 exe 旁边
appId: com.zhihuishu.auto
productName: ZhihuishuAuto
copyright: 仅供本人学习使用，请遵守平台用户协议

directories:
  output: release
  buildResources: desktop/assets

# asar 关掉：worker 要用子进程 + Playwright，真实文件路径最省事
asar: false

files:
  - package.json
  - 'desktop/**/*'
  - 'server/**/*'
  - '!**/*.map'
  - '!**/*.md'

extraResources:
  - from: browsers
    to: browsers
    filter:
      - '**/*'
      - '!_smoke-profile/**'
  - from: desktop/update.json
    to: update.json

win:
  target:
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: desktop/assets/icon.ico
  # portable 与 zip 共用这个名字，扩展名区分：ZhihuishuAuto-0.1.0-portable.exe / .zip
  artifactName: ZhihuishuAuto-${version}-portable.${ext}
  requestedExecutionLevel: asInvoker
  # 让包体积小一点：只留中文/英文
  electronLanguages:
    - zh-CN
    - en-US

portable:
  # 免安装不需要提权；每次启动解压到独立的 %TEMP% 子目录，退出后删除（不要在 %TEMP% 里放数据）
  requestExecutionLevel: user
