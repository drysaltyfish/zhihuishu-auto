<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>启动遇到问题</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 800px at 20% -10%, #1b2a4a 0%, #0f1117 55%, #0b0d12 100%);
        color: #e8eefc;
        font:
          14px/1.7 'Microsoft YaHei UI',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
      }
      .card {
        width: min(560px, 88vw);
        background: rgba(20, 26, 38, 0.86);
        border: 1px solid rgba(120, 160, 255, 0.18);
        border-radius: 16px;
        padding: 28px 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        margin: 0 0 18px;
        color: #9fb0cf;
      }
      .msg {
        background: rgba(255, 120, 120, 0.08);
        border: 1px solid rgba(255, 120, 120, 0.25);
        color: #ffb4b4;
        border-radius: 10px;
        padding: 10px 12px;
        margin: 0 0 18px;
        word-break: break-all;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(120, 160, 255, 0.3);
        background: rgba(80, 120, 255, 0.16);
        color: #dbe6ff;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(80, 120, 255, 0.26);
      }
      button.ghost {
        background: transparent;
        border-color: rgba(160, 180, 220, 0.2);
        color: #9fb0cf;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>本地服务没能启动</h1>
      <p>这不影响你的数据。点「重试」再启动一次；还不行就把日志导出发给开发者。</p>
      <div class="msg" id="msg"></div>
      <div class="row">
        <button id="retry">重试</button>
        <button id="quit" class="ghost">退出程序</button>
      </div>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const msg = q.get('msg');
      if (msg) document.getElementById('msg').textContent = msg;
      document.getElementById('retry').onclick = async () => {
        const btn = document.getElementById('retry');
        btn.disabled = true;
        btn.textContent = '正在重试…';
        try {
          await window.desktop.retryServer();
        } catch (e) {
          btn.disabled = false;
          btn.textContent = '重试';
        }
      };
      document.getElementById('quit').onclick = () => window.desktop.quitApp();
    </script>
  </body>
</html>
